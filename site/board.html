<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damoclès - Board Hebdomadaire</title>
    <link rel="icon" type="image/png" href="assets/images/logo-damocles.png">
    <meta name="description" content="Site de l'alliance Damoclès [DMO] : combats PvP, percepteurs, recyclages, forgemagie. L'épée est suspendue.">
    <meta name="theme-color" content="#7d5ff7">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Damoclès">
    <meta property="og:title" content="Damoclès [DMO] - Alliance PvP Dofus">
    <meta property="og:description" content="L'épée est suspendue. Combats, percepteurs, recyclages, forgemagie : le QG de l'alliance Damoclès.">
    <meta property="og:url" content="https://damocles-alliance.vercel.app/">
    <meta property="og:image" content="https://damocles-alliance.vercel.app/assets/images/og-damocles.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://damocles-alliance.vercel.app/assets/images/og-damocles.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260727d">
</head>
<body>

    <header class="header">
        <div class="header__inner">
            <div class="header__brand">
                <img class="header__logo" src="assets/images/logo-damocles.png" alt="Logo Damoclès">
                
            </div>

            <div class="header__user">
                <a href="admin.html" class="header__icon" id="nav-admin-link" title="Admin" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg>
                </a>
                <span class="header__username" id="nav-username"></span>
                <button class="header__icon" id="btn-logout" title="Deconnexion">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
                <button class="nav__toggle" id="nav-toggle">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <aside id="app-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>

    <main class="main">
        <div class="board-header mb-lg">
            <div>
                <h1 style="font-family: var(--font-title); font-size: 1.5rem; font-weight: 700; margin-bottom: var(--spacing-xs);">Droits Percepteurs</h1>
                <p class="text-muted" id="board-period" style="font-size: 0.8125rem;">Chargement...</p>
            </div>
            <div class="board-header__controls">
                <button class="btn btn--bda" id="btn-zones-bda" title="Zones réservées par la Banque d'Alliance">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    Zones BDA
                </button>
                <select class="form-select board-week-select" id="board-week-select">
                    <option value="last">Semaine passée (droits actuels)</option>
                    <option value="current">Semaine en cours (droits prochains)</option>
                </select>
            </div>
        </div>

        <!-- Barème : légende des paliers -->
        <div class="board-bareme" id="board-bareme">
            <div class="loading"><div class="spinner"></div> Chargement...</div>
        </div>

        <!-- Tableau des droits -->
        <div class="board-table-wrap" id="board-table-wrap">
            <div class="loading"><div class="spinner"></div> Chargement...</div>
        </div>

        <!-- Modal Zones BDA -->
        <div class="modal-overlay" id="modal-zones-bda">
            <div class="modal" style="max-width:500px;">
                <div class="modal__header">
                    <h2 class="modal__title">Zones réservées BDA</h2>
                    <button class="modal__close" id="modal-bda-close">&times;</button>
                </div>
                <p class="text-muted" style="font-size:0.8125rem;margin-bottom:var(--spacing-md);">Ces zones sont réservées par la <strong style="color:var(--color-warning);">Banque d'Alliance</strong> pour la pose de percepteurs. Les kamas récoltés financent le système de récompenses.</p>
                <div id="zones-bda-list">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=20260727"></script>
    <script src="js/board.js?v=20260727"></script>
</body>
</html>
