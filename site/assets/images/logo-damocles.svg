<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a8"/>
      <stop offset="0.5" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#7c828a"/>
    </linearGradient>
  </defs>
  <!-- le fil (l'epee de Damocles est suspendue) -->
  <line x1="60" y1="0" x2="60" y2="13" stroke="#d8d8d8" stroke-width="1.6"/>
  <!-- pommeau -->
  <circle cx="60" cy="18" r="5.2" fill="#7d5ff7"/>
  <!-- poignee -->
  <rect x="57" y="22" width="6" height="13" rx="2" fill="#5636c9"/>
  <!-- garde -->
  <rect x="41" y="35" width="38" height="6.5" rx="3.2" fill="#7d5ff7"/>
  <!-- lame pointe vers le bas -->
  <path d="M54.5 41.5 L65.5 41.5 L61.8 100 L60 112 L58.2 100 Z" fill="url(#blade)"/>
  <!-- arete centrale -->
  <line x1="60" y1="43" x2="60" y2="106" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
</svg>
